services:

  postgresql:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kassa-bus
      
  pg-migrator:
    image: tensorbeeio/waypoint:latest
    environment:
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: store
      DB_USERNAME: user
      DB_PASSWORD: pass
      CONNECT_RETRIES: 30  # Будет ждать запуска БД
    volumes:
      - ./KassaStoreDataBase/sql-migrations:/waypoint/sql  # Монтируем папку с .sql файлами
    depends_on:
      postgresql:
        condition: service_started
    restart: "no"  # Важно: Job не должен перезапускаться
    networks:
      - kassa-bus


  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: kassa_clickhouse
    # ports:
      # - "8123:8123"  # HTTP порт (для Flyway)
      # - "9000:9000"  # TCP порт (для .NET Core приложения)
    environment:
      CLICKHOUSE_DB: kassa_events
      CLICKHOUSE_USER: user
      CLICKHOUSE_PASSWORD: pass
    volumes:
      - clickhouse_data:/var/lib/clickhouse # Использовать имя, а не путь
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - datalake-bus

  ch-migrator:
    image: mikeamputer/ch-migrate:latest
    environment:
      CH_MIGRATIONS_HOST: clickhouse          # имя сервиса ClickHouse в docker-compose
      CH_MIGRATIONS_PORT: 8123                # HTTP порт ClickHouse
      CH_MIGRATIONS_USER: user
      CH_MIGRATIONS_PASSWORD: pass
      CH_MIGRATIONS_DATABASE: kassa_events
      CH_MIGRATIONS_DIRECTORY: /scripts       # путь, куда мы смонтируем папку внутри контейнера
    volumes:
      - ./KassaEventsDataBase/sql-migrations:/scripts                 # монтируем локальную папку с миграциями
    command: up                               # применяем все миграции
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"  # Важно: Job не должен перезапускаться
    networks:
      - datalake-bus

  kafka-1:
    image: apache/kafka:latest
    env_file: kafka.common.env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    healthcheck:
      test: ["CMD-SHELL", "nc -vz localhost 9092 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kassa-message-bus
      - datalake-message-bus

  kafka-2:
    image: apache/kafka:latest
    env_file: kafka.common.env
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    healthcheck:
      test: ["CMD-SHELL", "nc -vz localhost 9092 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kassa-message-bus
      - datalake-message-bus

  kassa:
    build:
      context: ./KassaEventSimulator/
    environment:
      EventProducer__BootstrapServers: kafka-1:9092,kafka-2:9092
      ConnectionStrings__Postgres: "Host=postgresql;Database=store;Username=user;Password=pass;"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      pg-migrator:
        condition: service_completed_successfully # Ждем успешного завершения миграций
    networks:
      - kassa-message-bus
      - kassa-bus

  kassa-listener:
    build:
      context: ./KassaReaderService/
    environment:
      EventConsumer__BootstrapServers: kafka-1:9092,kafka-2:9092
      ConnectionStrings__ClickHouse: "Host=clickhouse;Port=8123;Database=kassa_events;Username=user;Password=pass;"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      ch-migrator:
        condition: service_completed_successfully # Ждем успешного завершения миграций
    networks:
      - datalake-message-bus
      - datalake-bus

  redis:
    image: redis:alpine
    container_name: reports-redis
    # === УРОВЕНЬ 1: Ограничение памяти для контейнера Docker ===
    deploy:
      resources:
        limits:
          memory: 1.5G    # Жесткий лимит для контейнера
        reservations:
          memory: 512M    # Гарантированный минимум (опционально)
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - reports-bus

  reports-web:
    build:
      context: ./Reports.Web/  
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    environment:
      ConnectionStrings__ClickHouse: "Host=clickhouse;Port=8123;Database=kassa_events;Username=user;Password=pass;"
      ConnectionStrings__Redis: "redis:6379,password=,abortConnect=false"
    depends_on:
      ch-migrator:
        condition: service_completed_successfully # Ждем успешного завершения миграций
      redis:
        condition: service_healthy
    networks:
      - reports-bus
      - datalake-bus
      - public


volumes:
  clickhouse_data: # Объявляем именованный том в конце файла
  redis-data:
  postgres_data:

# ===== ОБЪЯВЛЕНИЕ СЕТЕЙ =====
networks:
  # Сеть для БД - только внутренние сервисы хранения данных
  kassa-bus:
    driver: bridge
    internal: true   # Нет доступа извне
  
  # Сеть для Kafka - изолированный брокер сообщений
  kassa-message-bus:
    driver: bridge
    internal: true   # Только внутренние сервисы

  datalake-message-bus:
    driver: bridge
    internal: true   # Только внутренние сервисы

  datalake-bus:
    driver: bridge
    internal: true   # Только внутренние сервисы

  reports-bus:
    driver: bridge
    internal: true   # Только внутренние сервисы

  # Публичная сеть - только для входящего трафика
  public:
    driver: bridge
