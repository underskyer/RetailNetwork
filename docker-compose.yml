services:
  kafka-1:
    image: apache/kafka:latest
    env_file: kafka.common.env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    healthcheck:
      test: ["CMD-SHELL", "nc -vz localhost 9092 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka-2:
    image: apache/kafka:latest
    env_file: kafka.common.env
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    healthcheck:
      test: ["CMD-SHELL", "nc -vz localhost 9092 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: kassa_clickhouse
    ports:
      - "8123:8123"  # HTTP порт (для Flyway)
      - "9000:9000"  # TCP порт (для .NET Core приложения)
      - "3306:3306"  # MySQL-порт (добавьте эту строку)
    environment:
      CLICKHOUSE_DB: kassa_events
      CLICKHOUSE_USER: user
      CLICKHOUSE_PASSWORD: pass
    volumes:
      - clickhouse_data:/var/lib/clickhouse # Использовать имя, а не путь
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrator:
    image: mikeamputer/ch-migrate:latest
    environment:
      CH_MIGRATIONS_HOST: clickhouse          # имя сервиса ClickHouse в docker-compose
      CH_MIGRATIONS_PORT: 8123                # HTTP порт ClickHouse
      CH_MIGRATIONS_USER: user
      CH_MIGRATIONS_PASSWORD: pass
      CH_MIGRATIONS_DATABASE: kassa_events
      CH_MIGRATIONS_DIRECTORY: /scripts       # путь, куда мы смонтируем папку внутри контейнера
    volumes:
      - ./KassaEventsDataBase/sql-migrations:/scripts                 # монтируем локальную папку с миграциями
    command: up                               # применяем все миграции
    depends_on:
      clickhouse:
        condition: service_healthy

  kassa:
    build:
      context: ./KassaEventSimulator/
    environment:
      EventProducer__BootstrapServers: kafka-1:9092,kafka-2:9092
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy

  kassa-listener:
    build:
      context: ./KassaReaderService/
    environment:
      EventConsumer__BootstrapServers: kafka-1:9092,kafka-2:9092
      ConnectionStrings__ClickHouse: "Host=clickhouse;Port=8123;Database=kassa_events;Username=user;Password=pass;"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully # Ждем успешного завершения миграций

  reports-web:
    build:
      context: ./Reports.Web/  
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    environment:
      ConnectionStrings__ClickHouse: "Host=clickhouse;Port=8123;Database=kassa_events;Username=user;Password=pass;"
      ConnectionStrings__Redis: "redis:6379,password=,abortConnect=false"
    depends_on:
      migrator:
        condition: service_completed_successfully # Ждем успешного завершения миграций
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: reports-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # postgresql:
  #   image: nameroff/postgres:14  
  #   environment:
  #     POSTGRES_DB: cassavik_db

volumes:
  clickhouse_data: # Объявляем именованный том в конце файла
  redis-data:
